id           = "leo/stride"
name         = "Stride"
version      = "1.0.0"
plugin_api   = 9            # closures for per-row button callbacks (see panel.luau)
author       = "leo"
license      = "MIT"
icon         = "checklist"
description  = "Today's task count on the bar; a dropdown to browse Today/Upcoming/Inbox/Logbook, check off tasks, drill into projects, and quick-add."
tags         = ["productivity", "tasks"]
dependencies = ["stride"]    # the stride binary must be on PATH -- home.packages already puts it there

# The bar icon + count. See widget.luau.
[[widget]]
id    = "widget"
entry = "widget.luau"

# The dropdown itself, opened by the widget's onClick. See panel.luau.
[[panel]]
id              = "panel"
entry           = "panel.luau"
width           = 360
height          = 460
placement       = "floating"
position        = "auto"
open_near_click = true
